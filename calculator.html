<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <style>
:root {
    --primary: #FF0000;
    --accent: #ff0000;
    --accent-hover: #ea580c;
    --bg-main: #f8fafc;
    --surface: #ffffff;
    --text-main: #000000;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --focus-ring: rgba(37, 99, 235, 0.2);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    max-width: 480px;
    margin: 60px auto;
    padding: 28px;
}

#container {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    margin-bottom: 20px;
}

h3 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    margin: 10px 0 8px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

input[type="number"],
input[type="button"] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.2s ease;
}

input[type="number"] {
    border: 1.5px solid var(--border);
    color: var(--text-main);
    background-color: #fff;
    outline: none;
    margin-bottom: 12px;
}
input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 3px var(--focus-ring);
}

input[type="button"] {
    background-color: var(--accent);
    color: #fff;
    border: none;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
input[type="button"]:hover {
    background-color: var(--accent-hover);
    box-shadow: 0 4px 8px rgba(200, 115, 22, 0.3);
}
input[type="button"]:active {
    transform: translateY(1px);
}

output {
    display: block;
    padding: 10px 0;
    font-weight: 600;
    font-size: 1rem;
}
    </style>
</head>
<body>

<form id="calcForm">
    <div id="container">
        <h3>Discount Calculator</h3>

        <label for="price">Price before discount</label>
        <input type="number" id="price" step="0.01" min="0" placeholder="Enter price">

        <label for="discount">Discount (%)</label>
        <input type="number" id="discount" step="0.01" min="0" max="100" placeholder="Enter discount %">

        <label for="priceAfter">Price after discount</label>
        <output id="priceAfter">₱0.00</output>

        <label for="savedAmount">Saved amount</label>
        <output id="savedAmount">₱0.00</output>

        <input type="button" id="btnCompute" value="Compute">
        <input type="button" id="btnReset" value="Reset">

        <label style="margin-top: 20px; font-size: 0.8rem; text-transform: none;">
            Rhon Stephen N. Fernandez, 12 — Cooper
        </label>
    </div>
</form>

<script>
const priceInput = document.getElementById("price");
const discountInput = document.getElementById("discount");
const priceAfter = document.getElementById("priceAfter");
const savedAmount = document.getElementById("savedAmount");
const btnCompute = document.getElementById("btnCompute");
const btnReset = document.getElementById("btnReset");

function computeDiscount() {
    const price = parseFloat(priceInput.value) || 0;
    const discountPct = parseFloat(discountInput.value) || 0;

    const discountValue = price * (discountPct / 100);
    const finalPrice = price - discountValue;

    savedAmount.textContent = `₱${discountValue.toFixed(5)}`;
    priceAfter.textContent = `₱${finalPrice.toFixed(5)}`;
}

function resetForm() {
    priceInput.value = "";
    discountInput.value = "";
    priceAfter.textContent = "₱0.00";
    savedAmount.textContent = "₱0.00";
}

btnCompute.addEventListener("click", computeDiscount);
btnReset.addEventListener("click", resetForm);
</script>

</body>
</html>
