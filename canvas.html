<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customized Christmas Tree</title>
    <style>
        #myDrawing {
            border: solid 5px red;
            background-color: #0b132b;
            max-width: 100%;
            height: auto;
        }

        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background-color: #192d1b;
        }
    </style>
</head>
<body>
    <canvas height="500" width="1000" id="myDrawing"></canvas>

    <script>
        const canvas = document.getElementById("myDrawing");
        const ctx = canvas.getContext("2d");

        const stars = [
            [120, 70, 2], [220, 120, 2.5], [310, 60, 1.8], [700, 80, 2.2],
            [820, 130, 2], [900, 65, 2.5], [160, 210, 1.8], [860, 220, 2]
        ];

        stars.forEach(([x, y, r]) => {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = "#FFF9C4";
            ctx.fill();
        });

        function drawSnowflake(x, y, size) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.PI / 3) * i);
                ctx.moveTo(-size, 0);
                ctx.lineTo(size, 0);
                ctx.restore();
            }
            ctx.stroke();
        }

        const snowflakes = [[180, 100, 6], [280, 180, 5], [750, 120, 7], [850, 190, 4], [350, 90, 5], [650, 70, 6]];
        snowflakes.forEach(([x, y, size]) => drawSnowflake(x, y, size));

        ctx.beginPath();
        ctx.moveTo(0, 445);
        ctx.quadraticCurveTo(500, 420, 1000, 445);
        ctx.lineTo(1000, 500);
        ctx.lineTo(0, 500);
        ctx.closePath();
        ctx.fillStyle = "#E3F2FD";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(475, 340);
        ctx.lineTo(525, 340);
        ctx.lineTo(535, 445);
        ctx.lineTo(465, 445);
        ctx.closePath();
        ctx.fillStyle = "#6D4C41";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#4E342E";
        ctx.stroke();

        function drawTreeTier(topX, topY, leftX, rightX, bottomY, fillColor, strokeColor) {
            ctx.beginPath();
            ctx.moveTo(topX, topY);
            ctx.lineTo(leftX, bottomY);
            ctx.quadraticCurveTo(topX, bottomY + 18, rightX, bottomY);
            ctx.closePath();

            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();
        }

        drawTreeTier(500, 200, 345, 655, 360, "#1B5E20", "#144919");
        drawTreeTier(500, 130, 375, 625, 275, "#236B28", "#1B5620");
        drawTreeTier(500, 55, 405, 595, 195, "#2E7D32", "#226327");

        function drawGarland(startX, startY, ctrlX, ctrlY, endX, endY) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#FFD54F";
            ctx.stroke();
        }

        drawGarland(445, 132, 500, 158, 555, 132);
        drawGarland(412, 215, 500, 248, 588, 215);
        drawGarland(375, 305, 500, 345, 625, 305);

        function drawCandyCane(x, y) {
            ctx.beginPath();
            ctx.moveTo(x, y + 26);
            ctx.lineTo(x, y + 8);
            ctx.arc(x + 6, y + 8, 6, Math.PI, 0, false);
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#FFFFFF";
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x, y + 22);
            ctx.lineTo(x, y + 15);
            ctx.moveTo(x + 2, y + 4);
            ctx.lineTo(x + 10, y + 5);
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#E53935";
            ctx.stroke();
            ctx.lineCap = "butt";
        }

        drawCandyCane(465, 155);
        drawCandyCane(545, 235);
        drawCandyCane(425, 315);

        function drawBell(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 8, Math.PI, 0, false);
            ctx.lineTo(x + 10, y + 15);
            ctx.lineTo(x - 10, y + 15);
            ctx.closePath();
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "#FFA000";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y + 17, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#B8860B";
            ctx.fill();
        }
        drawBell(480, 280);
        drawBell(525, 280);

        const ornaments = [
           { x: 500, y: 105, r: 9,  color: "#E53935" },
            { x: 465, y: 145, r: 9,  color: "#2196F3" },
            { x: 535, y: 145, r: 9,  color: "#FFD700" },
            { x: 500, y: 175, r: 10, color: "#E8E4C9" },
            { x: 435, y: 215, r: 10, color: "#FFD700" },
            { x: 495, y: 225, r: 10, color: "#E53935" },
            { x: 565, y: 215, r: 10, color: "#2196F3" },
            { x: 410, y: 258, r: 10, color: "#E8E4C9" },
            { x: 470, y: 262, r: 10, color: "#2196F3" },
            { x: 530, y: 262, r: 10, color: "#E53935" },
            { x: 590, y: 258, r: 10, color: "#FFD700" },
            { x: 455, y: 310, r: 11, color: "#FFD700" },
            { x: 520, y: 315, r: 11, color: "#E8E4C9" },
            { x: 585, y: 310, r: 11, color: "#E53935" },
            { x: 380, y: 348, r: 11, color: "#2196F3" },
            { x: 440, y: 355, r: 11, color: "#E53935" },
            { x: 500, y: 358, r: 11, color: "#FFD700" },
            { x: 560, y: 355, r: 11, color: "#2196F3" },
            { x: 620, y: 348, r: 11, color: "#E8E4C9" }
        ];

        ornaments.forEach(orb => {
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
            ctx.fillStyle = orb.color;
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(orb.x - orb.r * 0.3, orb.y - orb.r * 0.3, orb.r * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fill();
        });

        function drawPresent(x, y, width, height, boxColor, ribbonColor) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width, y);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x, y + height);
            ctx.closePath();
            ctx.fillStyle = boxColor;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#1A1A1A";
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(x + width / 2, y);
            ctx.lineTo(x + width / 2, y + height);
            ctx.moveTo(x, y + height / 2);
            ctx.lineTo(x + width, y + height / 2);
            ctx.lineWidth = 5;
            ctx.strokeStyle = ribbonColor;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x + width / 2 - 5, y - 4, 4, 0, Math.PI * 2);
            ctx.arc(x + width / 2 + 5, y - 4, 4, 0, Math.PI * 2);
            ctx.fillStyle = ribbonColor;
            ctx.fill();
        }

        drawPresent(385, 405, 50, 40, "#D32F2F", "#FFD54F");
        drawPresent(560, 410, 45, 35, "#1976D2", "#FFFFFF");

        function drawStar(cx, cy, outerR, innerR) {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
                const radius = i % 2 === 0 ? outerR : innerR;
                const angle = (Math.PI / 5) * i - Math.PI / 2;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#FFA000";
            ctx.stroke();
        }

        drawStar(500, 50, 22, 9);
    </script>
</body>
</html>
