<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokushibo</title>                                    
</head>
<body> 
    <center> 
        <div style="border: 2px solid rgb(132, 0, 255); padding: 15px 20px 15px 5px; display: inline-block;">
            <div style="background-color: rgb(132, 0, 255);">
            
            <div style="color: white"><h2>Portal Login</h2></div>          
            
            </div>
            <form>
                <table>
                    <tr>
                        <td><label for="basic-text">Username:</label></td>
                        <td><input type="text" id="basic-text" name="basic_text" placeholder="Enter Email..." maxlength="50"></td>
                    </tr>
                    <tr><td colspan="2"><br></td></tr>
                    <tr>
                        <td><label for="user-password">Password:</label></td>
                        <td><input type="password" id="user-password" name="user_password" placeholder="Enter Password" required></td>
                    </tr>
                </table>
                
                <p>
                    <button type="submit"><strong>Submit</strong></button>
                    <button type="reset"><em>Reset</em></button>
                </p>
            </form>

            <p>Created by: Fernandez - 12-Cooper</p>
        </div>
    </center>
</body>
</html>
